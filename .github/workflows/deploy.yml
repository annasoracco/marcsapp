name: Data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # After the US market close (covers both EDT and EST), weekdays.
    - cron: "20 22 * * 1-5"
    # Evening refresh for the Mad Money mentions after the show airs.
    - cron: "30 1 * * 2-6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore market data cache
        uses: actions/cache/restore@v6
        with:
          path: .data-cache
          key: hindsight-data-${{ github.run_id }}
          restore-keys: hindsight-data-

      # Builds a candidate dataset and only publishes it if it validates; otherwise it republishes the
      # last good dataset (cache, then live site). It never writes made-up prices. If no good dataset
      # exists at all, this step fails and the live site keeps its current deploy.
      - name: Fetch market data
        timeout-minutes: 20
        run: node scripts/fetch-data.mjs --out public/data --cache .data-cache

      - name: Save market data cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .data-cache
          key: hindsight-data-${{ github.run_id }}

      - name: Show what will be published
        run: node -e "const d=require('./public/data/hindsight.json'); console.log('prices through', d.asOf, '| CPI through', d.cpi.last, '| mentions', d.mentions.items.length, '| quarantined', d.quarantined.join(' ') || 'none')"

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
