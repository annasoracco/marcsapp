name: Refresh data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC times. Weekdays through the US trading day, after the close, and in the evening
    # once Mad Money segments are posted. One weekend run picks up anything late.
    - cron: '15 14,16,18,20 * * 1-5'
    - cron: '30 21 * * 1-5'
    - cron: '30 0,2 * * 2-6'
    - cron: '0 16 * * 0'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch market data and Mad Money segments
        run: node scripts/build-data.mjs site/data
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub pauses schedules in repos with no activity for 60 days; re-enabling keeps the refresh running.
  keepalive:
    if: github.event_name == 'schedule'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
