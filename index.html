  <body>
    <!--
      THESIS: A what-if time machine that answers one question with one number worth screenshotting.
      Refuses the finance dashboard: no tabs, no cards, no stat strips, no ticker tape.
      OWN-WORLD: Warm paper, near-black ink, midnight green as the one accent (Marc's line, the slider,
      the main action), silver for the S&P 500 and hairlines, rust only for losses with a glyph.
      Fraunces at display size for money, Geist for controls. Hairlines and whitespace, never boxes.
      STORY: Marc reads "If you'd put $30,000 into Apple in Oct 2007...", sees what it became against the
      S&P 500, drags time with his thumb, guesses how bad the worst drop was, and shares the card.
      FIRST VIEWPORT: the sentence with tappable amount, stock, and date; the huge number; one honest line;
      the two-line chart with direct labels. The start-date slider is docked in the thumb zone.
      FORM: one scrolling story, chosen by design critique between a paper hero and a midnight-green hero.
    -->

    <noscript>Hindsight needs JavaScript turned on.</noscript>
