<!doctype html>
<html lang="en">
  <!--
    THESIS: a calm evening briefing, not a dashboard. One sentence and one number lead every screen; detail is a tap away.
    OWN-WORLD: near-black ground, hairline dividers, midnight green #004C54 for brand and active states, silver #A5ACAF secondary text, teal #5FD3DC for interaction, separate gain green and loss red with arrows.
    STORY: Marc reads how the market did and why, checks Cramer's record, looks inside a fund, and logs a call in three taps.
    FIRST VIEWPORT: dateline, a plain-English hero sentence, the S&P move at 48px with a month line, index chips.
    FORM: native fintech list grammar (Apple Stocks / Robinhood dark), brief-pinned; bottom sheets for tasks.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#004c54" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="The market in plain English, a Cramer call scorecard, and a look inside any fund. Never asks about your money." />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bird's Eye" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Bird's Eye</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Bird's Eye needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
